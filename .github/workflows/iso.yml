name: Build Arch Linux ARM installer ISO

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'   # 03:00 UTC on the 1st of each month

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build ISO
        run: sudo ./scripts/build-iso.sh

      - name: Show build log tail on failure
        if: failure()
        run: |
          { tr '\r' '\n' < out/build.log | grep -a -v '^+' | grep -a -B45 -m1 'retry 1 of' | head -n 46; echo ---; tr '\r' '\n' < out/build.log | grep -a -v '^+' | tail -n 12; } 2>/dev/null | while IFS= read -r l; do
            l=${l//'%'/%25}; l=${l//$'\r'/}; echo "::error::${l:0:400}"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(date -u +%Y.%m.%d); TAG="iso-$D"
          cat > notes.md <<NOTES
          Arch Linux ARM aarch64 installer ISO, built $D from source with Archboot's tooling on an Arch Linux ARM system, using current Arch Linux ARM packages.
          Boots with UEFI on aarch64 (UTM with the QEMU backend, Parallels, VMware, ARM hardware with UEFI). Checksums are in SHA256SUMS.
          NOTES
          gh release create "$TAG" out/*.iso out/SHA256SUMS --title "Arch Linux ARM installer ISO $D" --notes-file notes.md
