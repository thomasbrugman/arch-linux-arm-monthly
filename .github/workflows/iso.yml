name: Build Arch Linux ARM installer ISO

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release after a successful boot test'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 1 * *'   # 03:00 UTC on the 1st of each month

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build ISO (upstream archiso, Arch Linux ARM packages)
        run: ./scripts/build-iso.sh

      - name: Boot and signed-package test in QEMU (aarch64, UEFI)
        run: ./scripts/boot-test.sh

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            out/build.log
            /tmp/serial.log
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(date -u +%Y.%m.%d); TAG="iso-$D"
          cat > notes.md <<NOTES
          Arch Linux ARM aarch64 live/installer ISO, built $D with upstream archiso (releng profile) from current Arch Linux ARM packages.
          UEFI only. It passed a live login and signed-package reinstall test in QEMU (aarch64, UEFI firmware) before this release was published. Checksums are in SHA256SUMS.
          NOTES
          gh release create "$TAG" out/*.iso out/SHA256SUMS --title "Arch Linux ARM ISO $D" --notes-file notes.md
